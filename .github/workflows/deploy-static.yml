# 注意：站点域名由 Notion「配置中心 / CONFIG-TABLE」里的 LINK 决定，
# 其优先级高于 NEXT_PUBLIC_LINK（见 lib/db/SiteDataApi.js: defaultLink = NOTION_CONFIG?.LINK || BLOG.LINK）。
# 2026-11-08 已把该配置从 http://preview.tangly1024.com 改为 https://www.bins-log.com，
# 否则 robots.txt / sitemap.xml / canonical 会全部指向主题作者的预览站。
# ===== NotionNext 构建并部署到自有云服务器（JD Cloud）+ Cloudflare Workers =====
# 构建在 GitHub 海外 runner 上进行（能正常连 notion.so），
# 仅导出静态文件（yarn run export -> out/），
# 然后经 SSH + rsync 上传到服务器 /var/www/notionnext/（nginx 托管）。
# 同一份 out/ 通过 Wrangler 直传 Cloudflare Workers 静态资源，避免 Cloudflare 侧构建
# 受 20 分钟时限 / Yarn 4 兼容性影响。已弃用 EdgeOne 的构建链路。

name: build-and-deploy-notionnext

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'   # 每 6 小时定时刷新 Notion 内容

concurrency:
  group: deploy-static
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: write
    # GitHub 仓库 Variables 全量注入构建环境（NEXT_PUBLIC_* 等非敏感配置,
    # 仓库 Settings -> Secrets and variables -> Actions -> Variables 里配）。
    env: ${{ vars }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Print page id (masked by value)
        run: echo "NOTION_PAGE_ID is ${NOTION_PAGE_ID:+set}"
        env:
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID || vars.NOTION_PAGE_ID }}

      - name: Install dependencies
        run: yarn install

      # 不要跨 run 恢复 notion-cache：本地文件缓存没有 TTL，
      # global/site 数据的 key 又固定，恢复旧缓存会让构建读到陈旧的 Notion 数据。
      # 同一次构建内部仍可用 NOTION_NEXT_NOTION_CACHE_DIR 去重，避免重复请求。
      - name: Static export (out/)
        id: build
        env:
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID || vars.NOTION_PAGE_ID || '4c0343b68ae38218b724016e5f89d00b' }}
          NOTION_TOKEN_V2: ${{ secrets.NOTION_TOKEN_V2 }}
          NEXT_PUBLIC_LINK: ${{ vars.NEXT_PUBLIC_LINK || 'https://www.bins-log.com' }}
          EXPORT: 'true'
          BUILD_MODE: 'true'
          NOTION_NEXT_NOTION_CACHE_DIR: ./notion-cache
        run: yarn run export

      - name: Check build output
        run: |
          test -f out/index.html || { echo '::error::out/index.html 缺失，导出失败'; exit 1; }
          du -sh out
          echo "files=$(find out -type f | wc -l)"

      # ---- Cloudflare Workers 静态资源直传（Pages 新项目已并入 Workers 平台）----
      # 先部署 Cloudflare：源站 SSH 失败不能挡住主站更新。
      # 需要仓库 Secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
      - name: Cloudflare deploy gate
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "go=${CF_TOKEN:+yes}" >> "$GITHUB_OUTPUT"

      - name: Setup Node for Wrangler
        if: steps.cf.outputs.go == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22   # Wrangler 4 要求 Node >= 22

      - name: Deploy to Cloudflare Workers
        id: cf_deploy
        if: steps.cf.outputs.go == 'yes'
        continue-on-error: true   # 由最后 Deployment summary 单独判定，避免失败后跳过源站部署
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.156.0 deploy   # 读取仓库根 wrangler.jsonc，上传 out/

      # ---- 部署到云服务器（SSH_HOST/SSH_USER/SSH_KEY/SSH_PORT Secrets 已由服务器配置）----
      # 源站是回退链路；SSH 失败只报警告，不阻塞 Cloudflare 主站发布。
      - name: Deploy gate
        id: deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "::warning::SSH_HOST/SSH_USER/SSH_KEY 不完整，跳过源站同步"
          fi

      - name: Deploy via parallel tar over ssh
        id: origin_deploy
        if: steps.deploy.outputs.go == 'yes'
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          OPT="-i $HOME/.ssh/deploy_key -p ${SSH_PORT:-22} -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
          DEV="${SSH_USER}@${SSH_HOST}"
          ssh $OPT "$DEV" 'mkdir -p /var/www/notionnext'
          cd out
          # 8 路并行 ssh 流,分块传输+压缩,绕开单流跨洋限速
          NFILES=$(find . -type f | wc -l)
          PER=$(( (NFILES + 7) / 8 ))
          find . -type f | split -l "$PER" - chunk.
          for c in chunk.*; do
            tar cz -T "$c" | ssh $OPT "$DEV" "tar xz -C /var/www/notionnext" &
          done
          wait
          rm -f chunk.*
          # 收尾:补漏 + 删除多余文件
          rsync -az --delete -e "ssh $OPT" ./ "$DEV:/var/www/notionnext/"
          echo "同步完成 out/ -> ${SSH_HOST}:/var/www/notionnext/"

      - name: Deployment summary
        if: always() && steps.build.outcome == 'success'
        env:
          CF_GATE: ${{ steps.cf.outputs.go }}
          CF_OUTCOME: ${{ steps.cf_deploy.outcome }}
          ORIGIN_GATE: ${{ steps.deploy.outputs.go }}
          ORIGIN_OUTCOME: ${{ steps.origin_deploy.outcome }}
        run: |
          echo "Cloudflare gate=${CF_GATE:-no} outcome=${CF_OUTCOME:-skipped}"
          echo "Origin gate=${ORIGIN_GATE:-no} outcome=${ORIGIN_OUTCOME:-skipped}"
          if [ "$CF_GATE" != "yes" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 未配置，无法部署 Cloudflare"
            exit 1
          fi
          if [ "$CF_OUTCOME" != "success" ]; then
            echo "::error::Cloudflare Workers 部署失败，请展开 Deploy to Cloudflare Workers 步骤日志"
            exit 1
          fi
          if [ "$ORIGIN_GATE" = "yes" ] && [ "$ORIGIN_OUTCOME" != "success" ]; then
            echo "::warning::源站 SSH 同步失败；Cloudflare 已独立部署，主站不受影响。请检查 SSH key/authorized_keys。"
          fi
