# ===== NotionNext 构建并部署到自有云服务器（JD Cloud） =====
# 构建在 GitHub 海外 runner 上进行（能正常连 notion.so），
# 仅导出静态文件（yarn run export -> out/），
# 然后经 SSH + rsync 上传到服务器 /var/www/notionnext/（nginx 托管）。
# 已弃用 EdgeOne 的构建链路。

name: build-and-deploy-notionnext

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'   # 每 6 小时定时刷新 Notion 内容

concurrency:
  group: deploy-static
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # GitHub 仓库 Variables 全量注入构建环境（NEXT_PUBLIC_* 等非敏感配置,
    # 仓库 Settings -> Secrets and variables -> Actions -> Variables 里配）。
    env: ${{ vars }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Print page id (masked by value)
        run: echo "NOTION_PAGE_ID is ${NOTION_PAGE_ID:+set}"
        env:
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID || vars.NOTION_PAGE_ID }}

      - name: Install dependencies
        run: yarn install

      - name: Restore Notion cache (跨构建复用,防 429 提速)
        uses: actions/cache@v4
        with:
          path: notion-cache
          key: notion-cache-${{ github.run_id }}
          restore-keys: |
            notion-cache-

      - name: Static export (out/)
        env:
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID || vars.NOTION_PAGE_ID || '4c0343b68ae38218b724016e5f89d00b' }}
          NOTION_TOKEN_V2: ${{ secrets.NOTION_TOKEN_V2 }}
          NEXT_PUBLIC_LINK: ${{ vars.NEXT_PUBLIC_LINK || 'https://www.bins-log.com' }}
          EXPORT: 'true'
          BUILD_MODE: 'true'
          NOTION_NEXT_NOTION_CACHE_DIR: ./notion-cache
        run: yarn run export

      - name: Check build output
        run: |
          test -f out/index.html || { echo '::error::out/index.html 缺失，导出失败'; exit 1; }
          du -sh out

      # ---- 部署到云服务器（SSH_HOST/SSH_USER/SSH_KEY/SSH_PORT Secrets 已由服务器配置）----
      - name: Deploy gate
        id: deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: echo "go=${SSH_HOST:+yes}" >> "$GITHUB_OUTPUT"

      - name: Deploy via parallel tar over ssh
        if: steps.deploy.outputs.go == 'yes'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          OPT="-i ~/.ssh/deploy_key -p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new"
          DEV="${SSH_USER}@${SSH_HOST}"
          ssh $OPT "$DEV" 'mkdir -p /var/www/notionnext'
          cd out
          # 8 路并行 ssh 流,分块传输+压缩,绕开单流跨洋限速
          NFILES=$(find . -type f | wc -l)
          PER=$(( (NFILES + 7) / 8 ))
          find . -type f | split -l "$PER" - chunk.
          for c in chunk.*; do
            tar cz -T "$c" | ssh $OPT "$DEV" "tar xz -C /var/www/notionnext" &
          done
          wait
          rm -f chunk.*
          # 收尾:补漏 + 删除多余文件
          rsync -az --delete -e "ssh $OPT" ./ "$DEV:/var/www/notionnext/"
          echo "同步完成 out/ -> ${SSH_HOST}:/var/www/notionnext/"
